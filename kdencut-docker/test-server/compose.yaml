services:
  kdencut-test:
    image: ${KDENCUT_TEST_IMAGE:?Run update.py to select a built image}
    container_name: kdencut-test
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: America/Chicago
      CUSTOM_USER: ${CUSTOM_USER}
      PASSWORD: ${PASSWORD}
    ports:
      - "3008:3000"
      - "3009:3001"
    volumes:
      - ./config:/config
      - ./projects:/storage/projects
      - ${MEDIA_DIR}:/media:ro
      - ${MEDIA_DIR}/Clips:/storage/clips:ro
      - ${MEDIA_DIR}/Music:/storage/music:ro
      - ${MEDIA_DIR}/Photos:/storage/photos:ro
      - ${MEDIA_DIR}/Video:/storage/video:ro
    shm_size: "1gb"
    restart: unless-stopped
