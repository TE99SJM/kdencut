services:
  kdencut:
    build:
      context: ..
      dockerfile: kdencut-docker/Dockerfile
      args:
        # 0 = use all CPU cores. Set 2 if the build runs out of memory.
        BUILD_JOBS: ${BUILD_JOBS:-0}
    image: kdencut:latest
    container_name: kdencut
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Chicago}
      - CUSTOM_USER=${CUSTOM_USER:-}
      - PASSWORD=${PASSWORD:-}
    volumes:
      - ${CONFIG_DIR:-./config}:/config
      - ${MEDIA_DIR:-./media}:/media
    ports:
      - ${HTTP_PORT:-3006}:3000
      - ${HTTPS_PORT:-3007}:3001
    shm_size: "1gb"
    restart: unless-stopped
